name: Daily Automation

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make daily change
        run: |
          mkdir -p daily
          echo "Daily update: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> daily/activity.log

      - name: Commit and push
        run: |
          git config user.name "manishgiri31"
          git config user.email "manishgiri312005@gmail.com"
          git add daily/activity.log
          git commit -m "Daily automated update" || echo "No changes to commit"
          git push
